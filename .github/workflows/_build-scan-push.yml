name: Build, scan, and push Docker image (reusable)

# Reusable workflow: build, push to GHCR, and Trivy-scan the image.
#
# Caller provides the primary tag (e.g. "latest", "v1.2.3").
# The short-SHA tag (sha-<7>) is always added automatically.
#
# Requires `secrets: inherit` in the caller so GITHUB_TOKEN is available.

on:
  workflow_call:
    inputs:
      primary-tag:
        description: "Primary image tag (e.g. 'latest', 'v1.2.3')"
        required: true
        type: string

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Login to GHCR
        # Auto-provisioned GITHUB_TOKEN (ADR-0017 §5); no long-lived PAT.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        # Image name is the literal `rag-wiki` (matches compose `image:` and
        # GHCR package name). Owner namespace comes from github.repository_owner.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rag-wiki:${{ inputs.primary-tag }}
            ghcr.io/${{ github.repository_owner }}/rag-wiki:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/rag-wiki:${{ inputs.primary-tag }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
